<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if error_title %}{{ error_title }}{% else %}Protected Redirect{% endif %} - RouteGhost</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <script>
        (function() {
            const storedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --bg: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #e2e8f0;
            --text: #0f172a;
            --text-dim: #64748b;
            --border: #cbd5e1;
        }
        html.dark-mode {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --danger: #ef4444;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #334155;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1rem;
            box-sizing: border-box;
        }
        .gate-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .gate-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }
        .gate-title {
            margin: 0 0 0.5rem 0;
            font-size: 1.35rem;
        }
        .gate-subtitle {
            margin: 0 0 1.5rem 0;
            color: var(--text-dim);
            font-size: 0.95rem;
        }
        .gate-error {
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.65rem 0.9rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .gate-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
            text-align: center;
            letter-spacing: 0.1em;
        }
        .gate-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .gate-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="gate-card">
        {% if error_title %}
            <div class="gate-icon">{{ error_icon or '🚫' }}</div>
            <h1 class="gate-title">{{ error_title }}</h1>
            <p class="gate-subtitle">{{ error_message }}</p>
        {% else %}
            <div class="gate-icon">🔒</div>
            <h1 class="gate-title">Protected Link</h1>
            <p class="gate-subtitle">Enter the PIN or password to continue to <strong>/redir/{{ slug }}</strong>.</p>
            {% if error %}
                <div class="gate-error">{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('redirects.handle_redirect', slug=slug) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="password" name="passcode" class="gate-input" placeholder="PIN or Password" autocomplete="off" autofocus required>
                <button type="submit" class="gate-btn">Unlock &amp; Continue</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
